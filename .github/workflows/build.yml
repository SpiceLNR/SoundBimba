# SPDX-License-Identifier: AGPL-3.0-or-later
# Автосборка: проверки и установщик на каждый push и pull request. Метка vX.Y.Z — черновик
# релиза с установщиком и SHA-256 (опубликовать черновик автор решает сам).
#
# Секретов здесь нет. Подпись (SignPath) добавим, когда фонд одобрит заявку: токен будет только
# в GitHub Secrets, а подпись — только для меток в этом репозитории (не для чужих форков и PR).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Версия Rust берётся из rust-toolchain.toml.
      - name: Rust
        run: |
          rustup install
          rustup show active-toolchain

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Licenses
        run: |
          node tools/licenses/check-cargo.mjs
          npm --prefix app run licenses

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: UI tests
        working-directory: app
        run: |
          npx tsc --noEmit
          npm test

      - name: Installer
        working-directory: app
        run: npx tauri build

      - name: SHA-256
        run: |
          $dir = 'target/release/bundle/nsis'
          Get-ChildItem $dir -Filter *-setup.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
          Get-Content "$dir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: soundbimba-windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: soundbimba-windows-x64
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "SoundBimba $TAG" \
            --notes "Unsigned build. Check the SHA-256 in SHA256SUMS.txt. / Сборка без подписи: сверьте SHA-256 из SHA256SUMS.txt."
