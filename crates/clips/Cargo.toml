[package]
name = "clips"
version = "0.1.0"
description = "SoundBimba sound clips for buttons: decode WAV/MP3/OGG/FLAC into 48 kHz stereo float"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { path = "../engine" }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac"] }
