[package]
name = "clips"
version = "0.1.0"
description = "SoundBimba sound clips for buttons: WAV/MP3/OGG/FLAC, head in memory, rest streamed from disk"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { path = "../engine" }
rtrb = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac"] }

[dev-dependencies]
graph = { path = "../graph" }
